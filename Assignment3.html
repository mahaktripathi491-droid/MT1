<!DOCTYPE html>
<html>
<head>
  <title>Block and Inline Elements</title>
</head>
<body>

  <h3><font color="#2d5a3c">Output</font></h3>
  <table border="1" bordercolor="#6a9978" cellspacing="0" cellpadding="20" width="100%">
    <tr>
      <td>
        

        <table bgcolor="#a3c1d1" width="100%" cellspacing="0" cellpadding="2">
          <tr>
            <td>Block 1</td>
          </tr>
        </table>
        <br>
        <table bgcolor="#a3c1d1" width="100%" cellspacing="0" cellpadding="2">
          <tr>
            <td>Block 2</td>
          </tr>
        </table>

        <br>
        <table cellspacing="2" cellpadding="2">
          <tr>
            <td bgcolor="#8ce09b">Inline 1</td>
            <td bgcolor="#8ce09b">Inline 2</td>
            <td bgcolor="#8ce09b">Inline 3</td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
