<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Admission 2026</title>
</head>
<body bgcolor="#ffffff" text="#000000">

  <center>
    <header>
      <table width="700" bgcolor="#131c7c" cellpadding="20" cellspacing="0" border="0">
        <tr>
          <td align="center">
            <h1><font color="#ffffff">ABC College Admission 2026</font></h1>
          </td>
        </tr>
      </table>
    </header>


    <main>
      <table width="520" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="left">
            
    
            <section aria-labelledby="courses-heading">
              <h2 id="courses-heading">Courses and Fees</h2>
              
              <table width="100%" border="1" bordercolor="#a0a0a0" cellpadding="8" cellspacing="0">
                <caption>Available Courses</caption>
                <thead>
                  <tr bgcolor="#f0f0f0">
                    <th scope="col">Course</th>
                    <th scope="col">Seats</th>
                    <th scope="col">Fees</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                  </tr>
                  <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                  </tr>
                </tbody>
              </table>
            </section>

            <br>

            <section aria-label="Student Application">
              <form action="#" method="post">
                <fieldset>
                  <legend>Application Form</legend>

                  <p>
                    <label for="student-name">Name:</label><br>
                    <input type="text" id="student-name" name="student_name" size="35" required minlength="2">
                  </p>

                  <p>
                    <label for="student-email">Email:</label><br>
                    <input type="email" id="student-email" name="student_email" size="35" required>
                  </p>

                  <p>
                    <label for="course-select">Course:</label><br>
                    <select id="course-select" name="course" required>
                      <option value="btech-cse" selected>B.Tech CSE</option>
                      <option value="bca">BCA</option>
                    </select>
                  </p>

                  <p>
                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="55" required minlength="10"></textarea>
                  </p>

                  <button type="submit">Apply</button>
                </fieldset>
              </form>
            </section>

          </td>
        </tr>
      </table>
    </main>

    <br>
    <footer>
      <table width="700" bgcolor="#131c7c" cellpadding="12" cellspacing="0" border="0">
        <tr>
          <td align="center">
            <font color="#ffffff" size="2">&copy; 2026 ABC College</font>
          </td>
        </tr>
      </table>
    </footer>
  </center>

</body>
</html><!--Mahak Tripathi 2026b15310179-->
