<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10: Multimedia</title>
</head>
<body>

    <h2>Assignment 10: Multimedia: Image, Video, Audio and YouTube</h2>
    <p>Aim: To embed an image, video, audio and a YouTube video in one page.</p>
    <hr>

    <h3>Image</h3>
    <img src="college.jpg" alt="College campus" width="300">

    <h3>Video</h3>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h3>Audio</h3>
    
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h3>YouTube</h3>
    <width="560" height="315" src="https://youtube.com" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

</body>
